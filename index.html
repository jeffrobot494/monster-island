<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1420" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Island Humans and Monsters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui"></div>
  <script>
    // dev: ?shot=ms delays the load event so headless screenshots capture a running island
    const shot = new URLSearchParams(location.search).get('shot');
    if (shot) document.write('<img style="position:fixed;width:1px;height:1px;opacity:0" src="/dev-ai/delay?ms=' + Number(shot) + '">');
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
